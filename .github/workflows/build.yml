name: Build SilverConsole

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: silverconsole-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configurar (Visual Studio 2022, x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Compilar Release
        run: cmake --build build --config Release --parallel 4 --target SilverConsole SilverConsoleTests ScPluginScanWorker ScDspWorker

      - name: Testar motor, hospedagem VST3 e scanner isolado
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Empacotar
        shell: pwsh
        run: |
          $out = "package/SilverConsole"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item build/SilverConsole_artefacts/Release/SilverConsole.exe $out/
          Copy-Item build/ScPluginScanWorker_artefacts/Release/ScPluginScanWorker.exe $out/
          Copy-Item build/ScDspWorker_artefacts/Release/ScDspWorker.exe $out/
          Copy-Item README.md,LICENSE,THIRD_PARTY.md $out/
          Copy-Item build/_deps/juce-src/LICENSE.md $out/JUCE-LICENSE.md
          python scripts/create-demo.py "$out/Demo"

      - uses: actions/upload-artifact@v4
        with:
          name: SilverConsole-Windows-x64
          path: package/
          if-no-files-found: error
          retention-days: 30
